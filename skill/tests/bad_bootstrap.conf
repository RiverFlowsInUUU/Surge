# 合成 fixture（**期望判负**）· 兜底指向纯境外节点 + 端点用主机名
#
# 这个 fixture 是给回归测试用的"坏配置"，故意踩两个坑：
#   ① encrypted-dns-server 用主机名（dns.google）—— 必须走一次明文引导解析
#   ② dns-server 写 system —— 最坏情况，等价于把引导交给运营商
#   ③ FINAL 指向纯代理组（没有任何 DIRECT 可达性保障）
# 期望：check_surge_dns.py 退出码 1
#
# ⚠️ 不要"顺手修好"这个文件 —— 它坏了才有价值。

[General]
dns-server = system
encrypted-dns-server = https://dns.google/dns-query
encrypted-dns-follow-outbound-mode = true
test-timeout = 5
internet-test-url = http://www.gstatic.com/generate_204
proxy-test-url = http://www.gstatic.com/generate_204

[Proxy]
Node-X = hysteria2, 203.0.113.5, 443, password=REPLACE_WITH_YOUR_PASSWORD, sni=example.com

[Proxy Group]
Proxy = select, "Node-X"

[Rule]
RULE-SET,https://raw.githubusercontent.com/RiverFlowsInUUU/jinx-ads-rules/main/surge-ads.list,REJECT,pre-matching,extended-matching
GEOIP,CN,DIRECT
FINAL,Proxy
