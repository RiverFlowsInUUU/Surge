# 合成 fixture（**期望通过**）· 只有本地端点、无任何规则集引用
#
# 这个 fixture 的作用是**反证上面两个 bad_* 不是恒定判负**：
# 它同样很小、同样只有一条节点，但把该做对的都做对了。
# 期望：check_surge_dns.py 退出码 0
#
# ⚠️ 它刻意**不引用任何远程规则集** —— 让回归测试不依赖网络。
#    代价是 checks 9/10 的报告会少几条 —— 那不影响断言（只看退出码）。

[General]
loglevel = notify
dns-server = 223.5.5.5, 119.29.29.29
encrypted-dns-server = https://223.5.5.5/dns-query, https://120.53.53.53/dns-query
encrypted-dns-follow-outbound-mode = false
hijack-dns = *
allow-dns-svcb = false
exclude-simple-hostnames = true
read-etc-hosts = true
use-local-host-item-for-proxy = false
ipv6 = true
ipv6-vif = auto
test-timeout = 5
internet-test-url = http://connect.rom.miui.com/generate_204
proxy-test-url = http://connect.rom.miui.com/generate_204
proxy-test-udp = apple.com@1.1.1.1
always-real-ip = *.lan, *.local, *.srv.nintendo.net, *.stun.playstation.net, *.xboxlive.com

[Proxy]
Node-X = hysteria2, 203.0.113.5, 443, password=REPLACE_WITH_YOUR_PASSWORD, sni=example.com

[Proxy Group]
Proxy = select, "Node-X"

[Rule]
RULE-SET,LAN,DIRECT,no-resolve
GEOIP,CN,DIRECT,no-resolve
FINAL,Proxy,dns-failed
