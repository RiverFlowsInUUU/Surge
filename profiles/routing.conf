# --- 7. AD（独立手动开关）----------------------------------------------------
# AD 组：独立的手动开关，不被规则引用 —— 这是刻意的分层，不是遗漏。
# 职责划分：拦截动作走字面量 REJECT（为了拿到 pre-matching 的 DNS 阶段拦截），
#            AD 组负责"面板上随时可切，给人工干预留一个入口"。
# 改默认拦截行为：改 [Rule] 里那条 RULE-SET 的策略，或整行注释掉。
# 想让 AD 直接接管开关：把那行策略从 REJECT 改成 AD，但要一并去掉 pre-matching。
AD = select, REJECT, DIRECT, icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/surge-anti-dns-leak/main/icons/AdBlock.png

# --- 8. Final ----------------------------------------------------------------
# 兜底组。`FINAL` 规则指向它，而不是直接写 `Proxy` —— 这样你在面板上还能改兜底去向。
Final = select, Proxy, Hong Kong, USA, Japan, Taiwan, Singapore, Korea, Other Regions, icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/surge-anti-dns-leak/main/icons/Final.png

# ===========================================================================

[Rule]
# ---- 1. 广告白名单守卫 ------------------------------------------------------
# 必须排在广告拦截**之前**：这 43 条是会被黑名单误杀的功能域，
# 要抢在 REJECT 之前放行。
RULE-SET,https://raw.githubusercontent.com/RiverFlowsInUUU/jinx-ads-rules/main/surge-white-guard.list,DIRECT

# ---- 2. 广告拦截：pre-matching REJECT --------------------------------------
# pre-matching 的 REJECT 在 **DNS 查询阶段和 TCP-SYN 阶段**就被求值，
# 被拦的请求得到一个 "No Record" / TCP RST 就结束了，连接层完全不会启动。
#
# 策略必须是**字面量** REJECT 族策略。写成策略组会加载失败：组的成员在运行时
# 可能解析成 DIRECT，Surge 无法据此保证"一定拦得住"。
#
# 想临时停用广告拦截：把策略改成 DIRECT，或整行注释掉。
RULE-SET,https://raw.githubusercontent.com/RiverFlowsInUUU/jinx-ads-rules/main/surge-ads.list,REJECT,pre-matching,extended-matching

# ---- 3. 按应用分流（粒度最细的规则放最前面）--------------------------------
# 顺序铁律：**越具体的越靠前**。这些应用规则必须排在下面的国内直连集之前，
# 否则一个 「ChatGPT 但域名恰好被国内清单收录」的场景会被直连接走。
#
# 全部带 no-resolve：这些规则集 100% 是域名条目，不需要为它们触发解析。
#
# ⚠️ 组内顺序也是刻意的：厂商专属规则（OpenAI / Gemini / Anthropic / Claude）
#    必须排在通用 `AI.list` **之前**，否则 AI 域名会先被 AI.list 接走，
#    永远轮不到 ChatGPT / Gemini / Claude 组。

# --- 3a. AI 厂商（专属优先）--------------------------------------------------
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/OpenAI/OpenAI.list,ChatGPT,"update-interval=86400",no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Gemini/Gemini.list,Gemini,"update-interval=86400",no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Anthropic/Anthropic.list,Claude,"update-interval=86400",no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Claude/Claude.list,Claude,"update-interval=86400",no-resolve
RULE-SET,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/75f0101039d71724b6e998b34604c2e053580e0c/Clash/Ruleset/AI.list,AI,"update-interval=86400",no-resolve

# --- 3b. 媒体与社交 ----------------------------------------------------------
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Spotify/Spotify.list,Spotify,"update-interval=86400",no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/YouTubeMusic/YouTubeMusic.list,YouTubeMusic,"update-interval=86400",no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/YouTube/YouTube.list,YouTube,"update-interval=86400",no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Telegram/Telegram.list,Telegram,"update-interval=86400",no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Twitter/Twitter.list,Twitter,"update-interval=86400",no-resolve

# --- 3c. 开发与系统 ----------------------------------------------------------
# ⚠️ GitHub 这一条**必须排在 direct.txt 之前**：github.com 同时被
#    白名单守卫（43 条，用于放行被广告黑名单误杀的功能域）和国内清单收录，
#    而 GitHub 组默认走 Proxy —— 这正是"应用分流"要生效的地方。
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/GitHub/GitHub.list,GitHub,"update-interval=86400",no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Google/Google.list,Google,"update-interval=86400",no-resolve
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Microsoft/Microsoft.list,Microsoft,"update-interval=86400",no-resolve

# --- 3d. 即时通讯（直连优先）-------------------------------------------------
# WeChat 组首项是 DIRECT ⇒ 把微信从兜底里摘出来，避免被 FINAL 送进代理。
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/WeChat/WeChat.list,WeChat,"update-interval=86400",no-resolve

# ---- 4. always-real-ip 主机名 ----------------------------------------------
# 与 [General] 的 always-real-ip 是同一批主机名。这里用 DOMAIN 规则（无需 DNS）
# 先接住它们，好让下面那些 IP 规则不用为了判它们而解析一次。
DOMAIN-SUFFIX,nintendo.net,Proxy
DOMAIN-SUFFIX,playstation.net,Proxy
DOMAIN-SUFFIX,xboxlive.com,Proxy

# ---- 5. Apple 服务直连 ------------------------------------------------------
# 这一节对应 egern v2.5 里的 `Apple_All_No_Resolve.list -> DIRECT`。
#
# 为什么是**两条**而不是一条：
#   - `SYSTEM` 是 Surge 内置集合，很小但权威（Apple 的激活 / 推送 / 定位 / 配对主机），
#     不依赖网络下载，加载失败也不会失效 —— 留它做**保底**。
#   - `Apple_All_No_Resolve.list` 覆盖面大得多（developer.apple.com、gs-loc.apple.com、
#     courier.push.apple.com、swcdn.apple.com …），是「Apple 服务」的实际承担者。
#   两条都在 => 覆盖面 + 兜不丢，且因为有 SYSTEM 在前，即便规则集下载失败也退化得可接受。
#
# ⚠️ 必须用 **No_Resolve** 版本，不能用 Apple_All.list —— 这是 egern 项目踩过的坑：
#    Apple_All.list 里有 13 条 IP-CIDR 没带 no-resolve（139.178.128.0/18 等 Apple CDN 段），
#    而本条规则排在后面那些 IP 规则**之前**且策略是 DIRECT ⇒ 每个还没命中的域名
#    经过这里都会**被强制解析一次**。那条解析走的是本地 DNS，就是泄露本身。
#    No_Resolve 版与原版逐条等价（只是那 13 条补上了 `,no-resolve`），覆盖面无损失。
RULE-SET,SYSTEM,DIRECT
RULE-SET,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Apple/Apple_All_No_Resolve.list,DIRECT,"update-interval=86400"

# ---- 6. 局域网 / 内网 -------------------------------------------------------
# LAN 含 IP-CIDR 条目，**必须** no-resolve；否则任何主机名的请求都会先做一次
# 公网 DNS 查询，只为拿来跟 10.0.0.0/8 比一下。那是纯粹的泄露面。
RULE-SET,LAN,DIRECT,no-resolve
RULE-SET,https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/private.txt,DIRECT,no-resolve

# ---- 7. 国内直连（域名类，主承重墙）-----------------------------------------
# 显式 no-resolve。这份清单是纯域名类规则集（11 万条 DOMAIN-SUFFIX / DOMAIN），
# 是国内直连的主力 —— 下面那条 GEOIP,CN 因为带 no-resolve 已经不再匹配域名，
# 所以国内域名**只能靠这里**接住。
#
# ⚠️ 分流版与 lazy.conf 在这一点上**完全一致**：国内域名直连不靠 geoip，靠这份清单。
#    这也是为什么本文件不需要 egern 的 `domain_suffix: cn` 兜底 —— direct.txt 已含 .cn。
RULE-SET,https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/direct.txt,DIRECT,no-resolve

# ---- 8. IP 规则，放最后 -----------------------------------------------------
# IP 类规则需要有已解析的地址。放在所有域名规则之后，使走代理 / 被广告拦截 /
# 国内直连的流量都不必做本地 DNS 查询。
# no-resolve 让它对未解析的主机名**跳过**，而不是暂停规则求值去解析它。
GEOIP,CN,DIRECT,no-resolve

# ---- 9. 兜底 ---------------------------------------------------------------
# dns-failed：万一规则求值因 DNS 失败而中断，用代理策略而不是让请求直接失败。
# 走代理的域名由节点远端解析，所以这一条既修好了失败，也避免了一次明文本地查询。
FINAL,Final,dns-failed

# ===========================================================================

[Host]
# 只列 Surge 自带 DNS 客户端可能处理错的那几个特殊主机名。
# localhost 内部就能解析，*.lan 已被 exclude-simple-hostnames + LAN 规则覆盖，
# 再映射一遍是冗余的。
localhost = server:system
*.lan = server:system
*.local = server:system

[URL Rewrite]
^https?://(www\.)?g\.cn https://www.google.com 302
^https?://(www\.)?google\.cn https://www.google.com 302
