# ============================================================================
# Surge 分流配置 · 按应用 + 按地区选路
#
# 与 lazy.conf 的分工：
#   lazy.conf     极简 —— 3 个策略组，全量流量一个出口，只做「防泄露 + 广告拦截 + AI」
#   routing.conf  分流 —— 按应用分组（ChatGPT / Claude / AI / Google …），
#                 每个组内部可再按地区切（香港 / 美国 / 日本 / 台湾 / 新加坡 / 韩国 / 其他）
#
# 两者的 [General] DNS 段与防泄露结构**完全一致**（由测试逐字断言），
# 差别只在 [Proxy Group] 与 [Rule] 的粒度。选一个用即可，不要叠加。
#
# ⚠️ 本文件是**脱敏模板**：
#   · 节点行是 RFC 5737 文档地址段（203.0.113.x），不会指向任何真实主机；
#   · 订阅 URL 里只有域名与 token 占位符，**不含任何真实机场地址**。
#   导入前必须替换：① [Proxy] 的节点；② 订阅组的 URL。
#   两处都不换的话，所有走代理的流量都不通。
#
# 结构（自上而下）：
#   [General]       全局：与 lazy.conf 逐字相同
#   [Proxy]         节点：占位
#   [Proxy Group]   策略组：Proxy → Smart → 地区组 → 应用组 → AD → Final
#   [Rule]          规则：白名单守卫 → 广告拦截 → 各应用 → 系统/内网 → 国内 → 兜底
#   [Host] / [URL Rewrite]
#
# audit-waive: 1 加密 DNS 端点保留 2 个主机名形式（dns.google / dns.alidns.com）。
#   这两个名字会被引导解析一次 —— 这是**刻意的取舍**，不是漏改：
#   换成纯 IP 字面量能消掉这一次解析，但会失去「按域名走 CDN 就近解析」与
#   「ECS 合规（不把公网 IP 交给非 CDN 的解析器）」两项收益。
#   消费者可自行取舍：想彻底消掉就把它们换成 IP 字面量。
# ============================================================================

[General]
loglevel = notify
show-error-page-for-reject = true

# --- DNS：加密、端点钉 IP、无明文通路 ----------------------------------------
# dns-server 必须写裸 IP，**绝不能写 system** —— 它只用于给加密 DNS 端点做
# 引导与连通性测试，如果它依赖系统解析器，就等于把引导过程交给了运营商 DHCP。
# 加密 DNS 端点全部写成 IP 字面量，因此启动期**没有任何主机名需要被明文解析**。
dns-server = 223.5.5.5, 119.29.29.29, 1.1.1.1, 8.8.8.8
encrypted-dns-server = https://1.1.1.1/dns-query, https://dns.google/dns-query, https://dns.alidns.com/dns-query
# 加密 DNS 连接一律走直连。保持 false 是为了避免 DoH 连接被绕回代理链形成环。
encrypted-dns-follow-outbound-mode = false
# 劫持硬编码的解析器请求：忽略 Surge DNS 的设备（HomePod / Apple TV /
# Chromecast / 智能音箱）发出的明文 :53 查询在这里被接管，不再裸奔到运营商。
hijack-dns = 8.8.8.8:53, 8.8.4.4:53, 1.1.1.1:53, 1.0.0.1:53, 9.9.9.9:53, 208.67.222.222:53
allow-dns-svcb = false
exclude-simple-hostnames = true
read-etc-hosts = true
# 保持 false：本地映射只服务 DIRECT 路径。开启会把本地 DNS 结果变成硬性代理目标，
# 破坏远端解析（走代理的域名应该由节点侧解析，本地不该有它的答案）。
use-local-host-item-for-proxy = false

# --- IPv6 ------------------------------------------------------------------
# ipv6 = true 让真实 IPv6 站点可直连；ipv6-vif = auto 只在本地网络**确实有**
# 可用 IPv6 前缀时才让 VIF 承载 IPv6，避免在纯 IPv4 Wi-Fi 上留一条死掉的 AAAA
# 路径（表现为连接超时 + 额外耗电）。
ipv6 = true
ipv6-vif = auto

# --- GeoIP -----------------------------------------------------------------
geoip-maxmind-url = https://raw.githubusercontent.com/adysec/IP_database/main/geolite/GeoLite2-Country.mmdb
# 第三方手工构造的 mmdb 不一定带官方签名；自动更新保持开启，
# 若日志里出现更新报错，用这个开关关掉即可。
disable-geoip-db-auto-update = false

# --- 连通性与延迟测试 --------------------------------------------------------
test-timeout = 5
internet-test-url = http://connect.rom.miui.com/generate_204
# 延迟测试端点用**境外** 204。
#
# ⚠️ 它是**性能探针**，不是泄露通道 —— 别拿"藏掉解析"的理由去改它。
# 走代理策略时解析发生在代理服务器（官方 KB：「DNS 解析永远在代理服务器进行」），
# 本地不产生查询。它的职责是给 smart 组 / 地区组打分，
# 而**分流版尤其依赖这个分数**：地区组的整个意义就是"同地区的节点谁最快"，
# 用境外端点测出的延迟含国际段，才贴近你真实访问境外站点的体感。
proxy-test-url = http://www.gstatic.com/generate_204
# 专用的 UDP 探针（QUIC 类策略 + smart 组的 UDP 评分都要用它）。
proxy-test-udp = apple.com@1.1.1.1

# --- 流量处理 ---------------------------------------------------------------
# 有节点不支持 UDP 时，让请求走代理侧解析后的 TCP，而不是直接失败。
udp-policy-not-supported-behaviour = reject
# 游戏模式：系统繁忙时优先处理 UDP 包。
udp-priority = true
# 代理策略默认已阻止 QUIC；这里显式声明，只在确实有用的地方放行 QUIC。
block-quic = per-policy

# --- 局域网共享与安全 --------------------------------------------------------
allow-wifi-access = true
allow-hotspot-access = true
# 两者保持 true：即使上级网络的 DMZ / 端口转发配得潦草，
# 代理与网关监听端口也不会暴露到当前子网之外。
proxy-restricted-to-lan = true
gateway-restricted-to-lan = true

# --- Wi-Fi / 蜂窝行为 -------------------------------------------------------
# all-hybrid = true 会让每条 TCP 连接**和**每次 DNS 查询同时走 Wi-Fi + 蜂窝，
# 是明确的耗电与流量代价。保持 false。
all-hybrid = false
wifi-assist = false

# Real-IP 豁免：游戏机 / NTP / STUN 主机名必须拿到真实可路由地址而不是 fake-IP，
# 否则 NAT 类型检测和时间同步会坏。注意 Surge 内置的 SYSTEM 集合已覆盖 Apple 自家流量。
always-real-ip = *.lan, *.local, *.localdomain, *.home.arpa, *.srv.nintendo.net, *.stun.playstation.net, *.xboxlive.com, stun.*, time.*.com, ntp.*.com, *.pool.ntp.org, *.market.xiaomi.com

# ===========================================================================

[Proxy]
# ⚠️ 占位节点，请替换为你的真实信息。203.0.113.0/24 是 RFC 5737 保留的
# 文档用地址段，不会指向任何真实主机。
#
# ⚠️ 分流版把节点名起成 `🇭🇰 香港-01` 这种带地区关键词的形式，**不是装饰**：
#    地区组的 `policy-regex-filter` 就是拿正则去匹配节点名。
#    下面几个占位节点名的地区关键词是刻意写进去的，好让你一导入就能看到
#    "香港 / 美国 / 日本 / 其它" 四个组各自筛到了东西。
#    换成你自己的节点时，只要节点名里含地区关键词，筛选就自动生效。
#
# ⚠️ 若你的节点名里**没有**地区关键词（比如叫 `Node-1` / `Node-A`），
#    不要慌：把地区组的 `policy-regex-filter` 换成你自己认得的写法即可
#    （例如按机场给的前缀 `(?i)^HK` ）。见 docs/11 的「地区名怎么筛」。
Node-HK-01 = hysteria2, 203.0.113.10, 52341, password=REPLACE_WITH_YOUR_PASSWORD, sni=REPLACE_WITH_YOUR_SNI
Node-HK-02 = hysteria2, 203.0.113.11, 52341, password=REPLACE_WITH_YOUR_PASSWORD, sni=REPLACE_WITH_YOUR_SNI
Node-US-01 = hysteria2, 203.0.113.12, 52341, password=REPLACE_WITH_YOUR_PASSWORD, sni=REPLACE_WITH_YOUR_SNI
Node-JP-01 = hysteria2, 203.0.113.13, 52341, password=REPLACE_WITH_YOUR_PASSWORD, sni=REPLACE_WITH_YOUR_SNI
Node-SG-01 = hysteria2, 203.0.113.14, 52341, password=REPLACE_WITH_YOUR_PASSWORD, sni=REPLACE_WITH_YOUR_SNI

# --- AnyTLS（中转链）-------------------------------------------------------
# reuse 保持默认（true）：连接复用正是"每个请求省掉一次 TCP+TLS 握手"的关键。
# 把它设成 false 是自找延迟。
#
# underlying-proxy 指向 Node-HK-01：先连落地节点，再由它去连本节点。
# 这条链是本文件里唯一需要"按顺序改"的地方 —— 改之前先确认 underlying-proxy
# 指的名字真实存在，否则 Surge 会以「无法解析 underlying-proxy」拒绝加载。
#
# ⚠️ 下面这条 CDN 中转域名已脱敏（原为个人私有中转域名）。
Node-Relay-01 = https, cdn-relay.example.com, 443, username="REPLACE_WITH_USERNAME", password="REPLACE_WITH_PASSWORD", underlying-proxy="Node-HK-01", sni=cdn-relay.example.com

# --- HTTP / HTTPS ----------------------------------------------------------
# ⚠️ 注意：`https`（TLS 上的 HTTP 代理）**完全不支持 UDP 转发**。
# 落到这类节点上的 UDP 会被拒绝（由 udp-policy-not-supported-behaviour=reject 决定），
# 这也是它们只放在 Claude 组、不做默认出口的原因。
#
# ⚠️ 下面这条的 server 是 IP 字面量（不是域名）—— 这是刻意的：IP 节点不产生
# "解析节点域名"这次查询，是本配置里唯一**必定发生**的本地解析，能省则省。
# skip-cert-verify 保持 true，因为落地只讲 HTTP over 443，TLS 由 AnyTLS 那一段提供。
Node-Relay-02 = https, 203.0.113.20, 443, underlying-proxy="Node-HK-02", skip-cert-verify=true, sni=203.0.113.20

# --- 已注释：不是 Surge 原生策略类型 -----------------------------------------
# VLESS Reality / XTLS 不是 Surge 的代理类型，写了会被跳过并告警，只是徒增解析噪音。
# Node-X = vless, 203.0.113.30, 443, ...

# ===========================================================================
# [Proxy Group] —— 分流版的全部机关都在这一段
#
# ⚠️ 先说一件**必须知道**的事，否则你会在官方文档里撞墙：
#
#   egern 有 `flatten: true` —— 把「Proxy」这个组名在求值时替换成**组内全部具体节点**，
#   于是 smart 可以逐个节点测速。**Surge 没有 flatten。**
#
#   Surge 的对应物是 `include-other-group="X"`：官方原文说它
#   "includes the **resolved member policies** from other policy groups" ——
#   同样是"复制已经解析出来的成员"，语义与 flatten 一致（可递归、可配正则）。
#
#   ⚠️ 但有一条硬限制（官方 Smart 组文档原文）：
#      「Smart 策略组不可以使用其他组作为子策略，也不可以用作 url-test 组的子策略。
#        但是可以使用 include-other-group 参数从其他组复制子策略。」
#
#   ⇒ 所以本配置按**用途**分两种写法，不是随意的风格差异：
#
#     ① 需要 smart 自动选优的地方（Proxy / Smart / 7 个地区组）
#        → 用 `include-other-group` / `policy-path`，让 smart 拿到**具体节点**。
#          这是唯一能让 smart 真正对节点逐个测速的写法。
#
#     ② 需要「面板上能点进地区再选」的地方（ChatGPT / Claude / AI 等应用组）
#        → 用 `select` + **地区组名直接列进成员**。
#          select 组允许成员是另一个组名（官方允许），代价是选优层级只有一层 ——
#          你选了「香港」，香港组内部会自己选最快的香港节点。
# ===========================================================================

[Proxy Group]
# --- 1. 总出口 --------------------------------------------------------------
# smart 组：按**真实连接的首字节延迟**、TCP 重传丢包、UDP 响应延迟三项给成员打分，
# 定期重测，并记住每个站点用哪个策略最合适。
#
# include-other-group="Airport" —— 把订阅组里**具体节点**复制进来。
# 不这么写的话，smart 的成员会只有「Airport」这一个**组名单位**：
# 它测不到组内的节点，整组的"自动选优"就退化成"在几个组之间猜"。
Proxy = smart, include-other-group="Airport", icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/surge-anti-dns-leak/main/icons/Proxy.png

# --- 2. 订阅入口 ------------------------------------------------------------
# Airport 只做一件事：把订阅链接里的节点拉进来。它**不被任何规则直接引用**。
# 引用它的永远是 `include-other-group="Airport"`（在 Proxy / Smart / 地区组里）。
#
# 想用「面板上手动切机场」而不是复制节点，就在应用组里把 Airport 加进成员 ——
# 但那样 smart 就测不到节点了，是明确的取舍。
#
# ⚠️ 把 URL 换成你自己的订阅。这是模板里**唯二**需要你填的地方（另一处是 [Proxy]）。
# token 已用占位符，不含任何真实机场地址。
Airport = select, policy-path=https://sub.example.com/api/v1/client/subscribe?token=REPLACE_WITH_YOUR_TOKEN, update-interval=86400, hidden=true, icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/surge-anti-dns-leak/main/icons/Airport.png

# --- 3. Smart（全节点池）-----------------------------------------------------
# 与 Proxy 的区别：Proxy 是"总出口、由你手动指定或让规则引用"，
# Smart 是"给其它组当节点池"用的裸池子。
# include-other-group="Airport" 同样是为了让 smart 拿到具体节点。
Smart = smart, include-other-group="Airport", icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/surge-anti-dns-leak/main/icons/Auto.png

# --- 4. 地区组（7 个）-------------------------------------------------------
# 每个地区组 = 「订阅里的节点」 + 「正则只保留该地区」。
#
# ⚠️ 正则同时管两件事：`policy-path` 拉进来的节点、`[Proxy]` 里的本机节点。
#    官方 policy-including 原文：`policy-regex-filter` "applies to members from
#    policy-path, include-all-proxies, and include-other-group, but not to
#    explicitly listed members"。
#    ⇒ 所以 `include-all-proxies=true` 是必须的，否则你自己手写的节点筛不进来。
#
# ⚠️ 地区名是**两份拷贝**：每个地区组写自己的正则，而 `Other Regions` 的负向断言
#    把其它 6 个组的关键词又抄了一遍。**改任何一个地区组，都要同步改 Other Regions。**
#    校验：`python skill/scripts/audit_region_filters.py profiles/routing.conf`
#
# ⚠️ 空组是允许的（本机节点名不含该地区关键词时就会空）。
#    Surge 不会因此拒绝加载 —— 但如果某条规则指向了空组，那条规则的流量会断。
#    导入后到面板上看一眼哪几个组是空的。

# 香港（含「深港 / 沪港 / 京港 / 广港」这类中转写法）
Hong Kong = smart, include-all-proxies=true, include-other-group="Airport", policy-regex-filter=(?i)🇭🇰|香港|Hong\s*Kong|\bHKG?\b|(?:深|沪|京|广)港, icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/surge-anti-dns-leak/main/icons/HongKong.png

# 美国（含主要城市名与机场三字码；`\bUSA?\b` 匹配 US / USA）
USA = smart, include-all-proxies=true, include-other-group="Airport", policy-regex-filter=(?i)🇺🇸|美国|United\s*States|America|\bUSA?\b|洛杉矶|硅谷|西雅图|芝加哥|达拉斯|凤凰城|阿什本|纽约|迈阿密|波士顿|休斯顿|亚特兰大|拉斯维加斯|圣地亚哥|盐湖城|奥斯汀|波特兰|丹佛|奥克兰|安大略|圣安娜|\b(?:LAX|SJC|SFO|SEA|ORD|JFK|DFW|IAD|PHX|ATL|BOS|MIA|EWR|LGA|IAH|HOU|DEN|OAK|ONT|SNA|LAS|PDX|DAL|SAN|SLC|MSP)\b, icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/surge-anti-dns-leak/main/icons/UnitedStates.png

# 日本
Japan = smart, include-all-proxies=true, include-other-group="Airport", policy-regex-filter=(?i)🇯🇵|日本|东京|大阪|Japan|\b(?:JPN?|NRT|HND|KIX|FUK|NGO|OSA|CTS|SDJ|OKA)\b, icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/surge-anti-dns-leak/main/icons/Japan.png

# 中国台湾
Taiwan = smart, include-all-proxies=true, include-other-group="Airport", policy-regex-filter=(?i)🇹🇼|台湾|Taiwan|\b(?:TWN?|TPE|Taipei)\b, icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/surge-anti-dns-leak/main/icons/Taiwan.png

# 新加坡
Singapore = smart, include-all-proxies=true, include-other-group="Airport", policy-regex-filter=(?i)🇸🇬|新加坡|狮城|Singapore|\b(?:SGP?|SIN)\b, icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/surge-anti-dns-leak/main/icons/Singapore.png

# 韩国
Korea = smart, include-all-proxies=true, include-other-group="Airport", policy-regex-filter=(?i)🇰🇷|韩国|首尔|仁川|Korea|South\s*Korea|\b(?:KOR|KR|ICN|SEL)\b, icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/surge-anti-dns-leak/main/icons/Korea.png

# 其它地区 —— 用**负向断言**排除上面 6 个地区的全部关键词，
# 末尾那串 `倍率|剩余|到期|流量|官网|订阅|测试|有效|禁止|邮箱|客服|地址|网站|群组`
# 是为了把订阅里常见的"信息行节点"（「剩余流量：100GB」这种）也排除掉。
#
# ⚠️ 它的关键词与上面 6 个组**完全重复**，是本文件里最大的一处维护负担。
#    官方 Surge 没有 filter 引用的写法（filter 不能写变量），只能靠脚本守。
#    校验命令见上面 Hong Kong 之前的注释块。
Other Regions = smart, include-all-proxies=true, include-other-group="Airport", policy-regex-filter=(?xi)^(?!.*(?:🇭🇰|香港|Hong\s*Kong|\bHKG?\b|(?:深|沪|京|广)港|🇯🇵|日本|东京|大阪|Japan|\b(?:JPN?|NRT|HND|KIX|FUK|NGO|OSA|CTS|SDJ|OKA)\b|🇸🇬|新加坡|狮城|Singapore|\b(?:SGP?|SIN)\b|🇹🇼|台湾|Taiwan|\b(?:TWN?|TPE|Taipei)\b|🇰🇷|韩国|首尔|仁川|Korea|South\s*Korea|\b(?:KOR|KR|ICN|SEL)\b|🇺🇸|美国|United\s*States|America|\bUSA?\b|洛杉矶|硅谷|西雅图|芝加哥|达拉斯|凤凰城|阿什本|纽约|迈阿密|波士顿|休斯顿|亚特兰大|拉斯维加斯|圣地亚哥|盐湖城|奥斯汀|波特兰|丹佛|奥克兰|安大略|圣安娜|\b(?:LAX|SJC|SFO|SEA|ORD|JFK|DFW|IAD|PHX|ATL|BOS|MIA|EWR|LGA|IAH|HOU|DEN|OAK|ONT|SNA|LAS|PDX|DAL|SAN|SLC|MSP)\b|倍率|剩余|到期|流量|官网|订阅|测试|有效|禁止|邮箱|客服|地址|网站|群组)).+$, icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/surge-anti-dns-leak/main/icons/WorldMap.png

# --- 5. MAX（低倍率节点池）--------------------------------------------------
# 只收**倍率小于 1** 的节点（0.01 / 0.08 / 0.1 / 0.2 / 0.5 / 0.99 …）。
#
# ⚠️ 正则为什么不是简单的 `0\.\d`：
#   · `(?<![\d.])` 保证 `0.` 前面不是数字或点 ⇒ 排除 `10.1 倍率` / `100.12 GB` 的尾部
#   · `0\.` 锁定小数形态 ⇒ 排除整数 `1x` / `2x`
#   · `\d*[1-9]` 要求至少一位非零数字 ⇒ 排除无意义的 `0.0`
#
# ⚠️ 残留风险（已知边界，未修）：若订阅把「信息行」也塞成节点名，
#    `剩余流量：0.5 TB` 这类仍会被收（0.5 < 1，从倍率语义看是"对的"）。
#    真遇到时在 filter 前面再加一段负向断言（排除「剩余流量 / 套餐到期」）即可。
#
# ⚠️ MAX 的定位是"给应用组当一个更省钱的候选池"，**不放进 Proxy 的默认首项** ——
#    egern v2.5 把 MAX 放在 Proxy 首位，那是它的默认出口。
#    本配置不这么做：默认出口是否要落到低倍率节点上，应该由你自己决定。
MAX = smart, include-all-proxies=true, include-other-group="Airport", policy-regex-filter=(?<![\d.])0\.\d*[1-9], icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/surge-anti-dns-leak/main/icons/Nfcloud.png

# --- 6. 应用组（按软件分流）-------------------------------------------------
# ⚠️ 全部是 `select`，成员里直接列**地区组名**。
#    这是刻意的：Surge 没有 flatten，把地区组列进来 = 面板上能「点进地区再选节点」，
#    代价是 smart 不参与（select 是手动选择，不测速）。
#    想要自动选优，把这个组换成 smart 并把成员改成 include-other-group="Hong Kong" 这种写法
#    —— 但**不能**把组名和 include-other-group 混着写（Smart 组不接受组名成员）。
#
# 顺序也是刻意的：第 1 项是**默认选中项**。把 `Proxy` 放第一，
# 意味着你不手动改的话，这个应用就走 Proxy 的总出口（同样的行为，但随时可切到具体地区）。

# ChatGPT（OpenAI）
ChatGPT = select, Proxy, Hong Kong, USA, Japan, Taiwan, Singapore, Korea, Other Regions, icon-url=https://raw.githubusercontent.com/RiverFlowsInUUU/surge-anti-dns-leak/main/icons/openai.png

