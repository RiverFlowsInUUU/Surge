# 合成 fixture（**期望判负**）· 规则顺序倒置 + 广告拦截指向策略组
#
# 故意踩三个坑：
#   ① `GEOSITE` 式的域名类直连排在 REJECT **之前** ⇒ 广告拦截永远轮不到
#      （这里用 RULE-SET direct.txt 模拟：它也是 DIRECT，会先接走国内广告域名）
#   ② 广告拦截的策略写成**策略组** `AD` 而不是字面量 REJECT
#      ⇒ Surge 会以「使用了非 REJECT 策略」拒绝加载（pre-matching 的硬要求）
#   ③ IP 类规则缺 no-resolve
# 期望：check_surge_dns.py 退出码 1
#
# ⚠️ 不要"顺手修好"这个文件 —— 它坏了才有价值。

[General]
dns-server = 223.5.5.5, 119.29.29.29
encrypted-dns-server = https://223.5.5.5/dns-query, https://120.53.53.53/dns-query
encrypted-dns-follow-outbound-mode = false

[Proxy]
Node-X = hysteria2, 203.0.113.5, 443, password=REPLACE_WITH_YOUR_PASSWORD, sni=example.com

[Proxy Group]
Proxy = select, "Node-X"
AD = select, REJECT, DIRECT

[Rule]
# ① 域名类直连抢在 REJECT 前面 —— 这是"规则看着配了、广告还在"的头号原因
RULE-SET,https://raw.githubusercontent.com/Loyalsoldier/surge-rules/release/ruleset/direct.txt,DIRECT,no-resolve
# ② 策略写成策略组，不是字面量 REJECT
RULE-SET,https://raw.githubusercontent.com/RiverFlowsInUUU/jinx-ads-rules/main/surge-ads.list,AD,pre-matching,extended-matching
# ③ IP 类规则缺 no-resolve
GEOIP,CN,DIRECT
FINAL,Proxy
